name: Sync validated NBA data

'on':
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: write

jobs:
  sync:
    if: ${{ vars.COURTMATCH_PLAYER_DIRECTORY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pandas openpyxl
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: python scripts/build_id_maps.py
      - run: python scripts/sync_data.py
        env:
          COURTMATCH_PLAYER_DIRECTORY: ${{ vars.COURTMATCH_PLAYER_DIRECTORY }}
      - run: git diff --exit-code public/data data/reports || (git config user.name 'courtmatch-bot' && git config user.email 'courtmatch-bot@users.noreply.github.com' && git add public/data data/reports && git commit -m 'data: sync validated NBA dataset' && git push)
