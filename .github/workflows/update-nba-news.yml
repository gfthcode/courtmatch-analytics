name: Refresh NBA news feed

on:
  push:
    branches: [main]
    paths:
      - 'data/news.json'
      - 'scripts/update-news.py'
      - '.github/workflows/update-nba-news.yml'
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-news-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch and validate ESPN NBA news
        run: python scripts/update-news.py
        env:
          COURTMATCH_NEWS_OUTPUT: data/news.json
      - name: Publish changed news snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "News snapshot has no changes."
          else
            git commit -m "chore: refresh NBA news feed"
            git push origin main
          fi
